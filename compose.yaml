services:
  db: &mariadb
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: fridegeshare
      MARIADB_USER: ${DB_USERNAME:-fridegeshare}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your terminal}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mariadb --host=127.0.0.1 --user="$$MARIADB_USER" --password="$$MARIADB_PASSWORD"
          --database="$$MARIADB_DATABASE" --execute='SELECT 1 FROM users LIMIT 1'
      interval: 5s
      timeout: 5s
      retries: 20

  db-test:
    <<: *mariadb
    profiles: ["test"]
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - mariadb_test_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mariadb_data:
  mariadb_test_data:
