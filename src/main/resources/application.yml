spring:
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:${DB_PORT:3308}/fridegeshare}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:fridegeshare}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: "SET time_zone = '+09:00'"
  sql:
    init:
      mode: never
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

mybatis:
  configuration:
    map-underscore-to-camel-case: true
